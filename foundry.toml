[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "safe130/=lib/safe-1.3.0/contracts/",
  "safe141/=lib/safe-1.4.1/contracts/",
  "safe150/=lib/safe-1.5.0/contracts/",
]

[fuzz]
runs = 64
